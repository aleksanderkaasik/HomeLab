---
- name: Running Nginx Reverse Proxy Playbook
  hosts:
  vars_files:
    - variables/config/NginxReverseProxy.yml
    - variables/system/certificate.yml
  tasks:
    - name: Installing nginx, certbot and nginx plugin
      become: true
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
        update_cache: true

    - name: Enabling nginx
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy nginx config
      become: true
      ansible.builtin.copy:
        content: |
          server {
            listen 80;
            server_name {{ item.DomainName }};
          {% if item.RedirectHttpsIsEnabled %}
            return 301 https://$server_name$request_uri;
          {% else %}
            location / {
                proxy_pass {{ item.path }};
                include proxy_params;
            }
          {% endif %}
          }
          
          server {
            listen 443 ssl http2;
            server_name {{ item.DomainName }};

            ssl_certificate /etc/letsencrypt/live/{{ item.DomainName }}/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/{{ item.DomainName }}/privkey.pem;

            location / {
                proxy_pass {{ item.path }};
                include proxy_params;
            }
          }
        dest: "/etc/nginx/sites-enabled/{{ item.DomainName }}.conf"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ReverseProxyConfig }}"
      notify: Restart nginx

    - name: Generate SSL certificates
      become: true
      ansible.builtin.shell: certbot certonly --nginx -d {{ item.DomainName }} --non-interactive --agree-tos --register-unsafely-without-email
      args:
        creates: "/etc/letsencrypt/live/{{ item.DomainName }}/"
      loop: "{{ ReverseProxyConfig }}"
      notify: Restart nginx   

    - name: Getting list of Certbot Certificates
      become: true
      ansible.builtin.shell: certbot certificates | grep Domains | tr -d ' ' | sed 's/Domains://g'
      register: CertbotCertificates

    - name: Delete unused Certbot Certificates
      become: true
      ansible.builtin.shell: certbot delete --cert-name {{ item }} --non-interactive --agree-tos --register-unsafely-without-email
      when: item in (ReverseProxyConfig | map(attribute='DomainName') | list)
      loop: "{{ CertbotCertificates.stdout_lines }}"

    - name: Getting list of Nginx site configs
      become: true
      ansible.builtin.shell: ls /etc/nginx/sites-enabled/
      register: nginxSites

    - name: Delete unused Nginx site configs 
      become: true
      ansible.builtin.file:
        state: "absent"
        path: "/etc/nginx/sites-enabled/{{ item }}"
      when: item in (ReverseProxyConfig | map(attribute='DomainName') | list)
      loop: "{{ nginxSites.stdout_lines }}"

    - name: Configure automatic certificate renewal
      ansible.builtin.cron:
        name: "Certbot certificate renewal"
        minute: "0"
        hour: "3"
        day: "*"
        month: "*"
        weekday: "*"
        job: "/usr/bin/certbot renew --quiet --deploy-hook 'systemctl reload nginx'"

  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
